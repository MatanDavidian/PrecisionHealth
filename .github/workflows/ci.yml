# Every push and pull request: the whole test suite. On main, when it is all
# green: publish the site, then check the live site serves what was pushed.
#
# Until this existed, tests ran only when someone remembered, and a push to
# main went to production whether they passed or not.
#
# The repository is PUBLIC, so these logs are public. No step may print a
# token, an email address, or a response body that could contain either.
#
# Needs (Settings → Secrets and variables → Actions):
#   variables  VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   (public values; the build needs them)
#   secrets    CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (deploy only; skipped until set)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  unit:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # The Supabase contract tests skip themselves without test-account
      # credentials, which CI deliberately does not hold.
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  functions:
    name: Server functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: npm run check:functions
      - run: npm run test:functions

  database:
    name: Migrations and database rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A throwaway Postgres in Docker: every migration in order, then the
      # invariants, the grants and the reservation race.
      - run: npm run db:verify
      - run: ./supabase/test/concurrency.sh

  deploy:
    name: Publish and check the live site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, e2e, functions, database]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy skipped — CLOUDFLARE_API_TOKEN is not set yet. Cloudflare's own Git deploy is still publishing."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      # The production build: no VITE_ENABLE_FAKE, so no test estimator.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3 pages deploy dist --project-name=precisionhealth --branch=main --commit-hash="$GITHUB_SHA"
      - if: env.CLOUDFLARE_API_TOKEN != ''
        name: Wait for vimetry.app to serve this commit
        run: |
          for attempt in $(seq 1 24); do
            served=$(curl -s https://vimetry.app/ | grep -o 'name="build-commit" content="[^"]*"' | sed 's/.*content="//;s/"//')
            [ "$served" = "$GITHUB_SHA" ] && exit 0
            sleep 10
          done
          echo "vimetry.app still serves ${served:0:7}, expected ${GITHUB_SHA:0:7}"
          exit 1
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx playwright install --with-deps chromium && npm run check:live
