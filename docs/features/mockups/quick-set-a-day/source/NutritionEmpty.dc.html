<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutrition tab, a day with nothing logged</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#2b2721}a:hover{color:#504c45}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f1ece1; color: #2b2721; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 28px 22px 0; display: flex; flex-direction: column; gap: 14px">

    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1.1">Nutrition</h1>
      <p style="margin: 4px 0 0; font-size: 14px; color: #656056">Sunday, 15 November</p>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Previous day" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#504c45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <p style="margin: 0; font-size: 15px; font-weight: 500">Sunday</p>
      <button type="button" aria-label="Next day" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#504c45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <div style="background: #e8e1d1; border-radius: 20px; padding: 16px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <p style="grid-column: 1 / -1; margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #656056">Total for Sunday</p>
      <div><p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #656056">Calories</p><p style="margin: 2px 0 0; font-size: 22px; font-weight: 500">0</p></div>
      <div><p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #656056">Protein</p><p style="margin: 2px 0 0; font-size: 22px; font-weight: 500">0 g</p></div>
    </div>

    <section style="border: 1px dashed #c9bea8; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
      <div>
        <h2 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 400; font-size: 22px; line-height: 1.25">No meals on Sunday</h2>
        <p style="margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: #504c45">Add what you ate, or set the day roughly if you don't remember.</p>
      </div>

      <a href="NutritionEmpty.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; background: #c2673e; color: #faf7f0; font-size: 15px; font-weight: 600; text-decoration: none">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#faf7f0" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        Add a meal
      </a>

      <div style="display: flex; align-items: center; gap: 10px; color: #656056; font-size: 12px">
        <span style="flex: 1; height: 1px; background: #ddd4c2"></span>or set the day<span style="flex: 1; height: 1px; background: #ddd4c2"></span>
      </div>

      <div role="group" aria-label="How much did you eat on Sunday?" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ choices }}" as="choice" hint-placeholder-count="4">
          <button type="button" onClick="{{ choice.pick }}" aria-pressed="{{ choice.pressed }}" style="{{ choice.style }}">
            <span style="display: block; font-size: 14px; font-weight: 600">{{ choice.label }}</span>
            <span style="display: block; padding-top: 2px; font-size: 12px; font-variant-numeric: tabular-nums">{{ choice.detail }}</span>
          </button>
        </sc-for>
      </div>
      <a href="TodayFilled.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; border: 1px solid #2b2721; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none">{{ setLabel }}</a>
      <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #656056">Marked as an estimate, and left out of your average.</p>
    </section>

  </div>

  <nav aria-label="Main" style="height: 62px; box-sizing: border-box; border-top: 1px solid #ddd4c2; background: #faf7f0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="TodayEvening.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: #656056; text-decoration: none">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#656056" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      Log
    </a>
    <a href="DayPast.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: #656056; text-decoration: none">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#656056" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>
      Today
    </a>
    <a href="NutritionEmpty.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: #a2512e; text-decoration: none">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a2512e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
      Nutrition
    </a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: #656056; text-decoration: none">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#656056" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
      Settings
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'avg' };
}
renderVals() {
const options = [
{ id: 'less', label: 'Less', detail: '−15% · 1,630 kcal', set: 'Set Sunday: 1,630 kcal' },
{ id: 'avg', label: 'Average', detail: '1,920 kcal', set: 'Set Sunday: 1,920 kcal' },
{ id: 'more', label: 'More', detail: '+15% · 2,210 kcal', set: 'Set Sunday: 2,210 kcal' },
{ id: 'number', label: 'A number', detail: 'You choose', set: 'Set Sunday: your number' }
];
const on = 'box-sizing: border-box; min-height: 60px; padding: 8px 12px; border: 1px solid #2b2721; border-radius: 16px; background: #2b2721; color: #faf7f0; font-family: inherit; text-align: start; cursor: pointer';
const off = 'box-sizing: border-box; min-height: 60px; padding: 8px 12px; border: 1px solid #ddd4c2; border-radius: 16px; background: #faf7f0; color: #2b2721; font-family: inherit; text-align: start; cursor: pointer';
const current = options.find((o) => o.id === this.state.picked) || options[1];
return {
setLabel: current.set,
choices: options.map((o) => ({
label: o.label,
detail: o.detail,
pressed: String(o.id === this.state.picked),
style: o.id === this.state.picked ? on : off,
pick: () => this.setState({ picked: o.id })
}))
};
}
}
</script>
</body>
</html>
