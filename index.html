<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Installable: the manifest names the app and its icons (docs/ANDROID-APP.md
      step 1). The Android app is this same site, wrapped.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f1ece1" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vimetry" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fraunces and Inter carry no Hebrew glyphs, so Hebrew falls through to
      Frank Ruhl Libre and Heebo further down the stacks in styles.css — which
      is exactly what a font stack is for.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;600&family=Heebo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Filled in from src/brand.ts at build time — see vite.config.ts. -->
    <title>%PAGE_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
